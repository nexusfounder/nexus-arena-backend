# ==============================================================================
# NEXUS GAMING ARENA - PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# Compliant with Reserve Bank of India (RBI) Payment Aggregator Cyber Framework
# and PCI DSS v4.0.1 Edge Security Standards
# ==============================================================================

# 1. Rate Limiting Zones (Max 5 requests/minute per client IP for payments)
limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general_api_limit:10m rate=30r/m;

# 2. RBI Data Localization & Sanitized Audit Logging Format
log_format rbi_localized_ssl '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'ssl_protocol=$ssl_protocol ssl_cipher=$ssl_cipher '
                            'region="ap-south-1-mumbai" '
                            'rbi_pa_compliant="true"';

upstream nexus_backend {
    server 127.0.0.1:8088 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name arena.nexusgaming.in api.nexusgaming.in;

    # Mandatory redirect to Strict TLS 1.3
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arena.nexusgaming.in api.nexusgaming.in;

    # ==========================================================================
    # A. STRICT TLS 1.3 ENFORCEMENT (RBI CYBER RESILIENCE DIRECTIVE)
    # Turn off TLS 1.0, 1.1, and 1.2 legacy protocols. Prevent packet sniffing.
    # ==========================================================================
    ssl_certificate /etc/letsencrypt/live/arena.nexusgaming.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arena.nexusgaming.in/privkey.pem;

    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling for certificate validation speed and privacy
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Access log configured for 100% Indian Data Localization Audit
    access_log /var/log/nginx/nexus_rbi_localized_access.log rbi_localized_ssl;
    error_log /var/log/nginx/nexus_rbi_error.log warn;

    # ==========================================================================
    # B. HARDENED SECURITY HEADERS & PCI DSS v4.0.1 CLIENT SCRIPT MONITORING
    # ==========================================================================
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Data-Localization "ap-south-1-mumbai" always;
    add_header X-RBI-PA-Compliance "RBI/2020-21/79" always;

    # PCI DSS v4.0.1 Content Security Policy with authorized aggregator domains only
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com https://js.stripe.com https://cdn.jsdelivr.net; img-src 'self' data: https: https://api.qrserver.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.razorpay.com https://*.firebaseio.com wss://*.firebaseio.com; frame-src 'self' https://api.razorpay.com https://js.stripe.com; object-src 'none';" always;

    # ==========================================================================
    # C. PAYMENT ENDPOINT PERIMETER DEFENSE (STRICT RATE LIMITING)
    # Max 5 requests per minute per IP to mitigate credential stuffing & bot probes
    # ==========================================================================
    location ~* ^/(api/payments/|api/wallet/) {
        limit_req zone=payment_limit burst=2 nodelay;
        limit_req_status 429;

        proxy_pass http://nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Data-Localization "ap-south-1-mumbai";

        # Timeouts to prevent slowloris holding connections
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # General API routes
    location /api/ {
        limit_req zone=general_api_limit burst=10 nodelay;

        proxy_pass http://nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket Realtime Gateway (Live brackets & ledger balance events)
    location /ws {
        proxy_pass http://nexus_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static Assets & Frontend Web Application
    location / {
        root /var/www/nexus_gaming_arena/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }
}
